[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openk"
version = "2.0.0"
description = "OpenK — Interactive Data Profiling, Fuzzy Clustering, and Reproducible Data Wrangling Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
openk = "openk.cli:main"

[tool.setuptools.packages.find]
include = ["openk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
